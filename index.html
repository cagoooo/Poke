<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>萌獸數學道館</title>
    <meta
      name="description"
      content="選擇萌獸，透過加減乘除與 ATG 即時對戰挑戰道館關主，適合課堂投影與數學練習。"
    />
    <meta name="theme-color" content="#2f6fed" />
    <link rel="canonical" href="https://cagoooo.github.io/Poke/" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cagoooo.github.io/Poke/" />
    <meta property="og:title" content="萌獸數學道館" />
    <meta
      property="og:description"
      content="選萌獸、答數學題、放招式，透過 ATG 即時對戰擊敗道館關主！"
    />
    <meta property="og:image" content="https://cagoooo.github.io/Poke/assets/og-math-beast-gym.png?v=20260702-1" />
    <meta property="og:image:secure_url" content="https://cagoooo.github.io/Poke/assets/og-math-beast-gym.png?v=20260702-1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="萌獸數學道館：ATG 即時對戰與加減乘除挑戰" />
    <meta property="og:locale" content="zh_TW" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="萌獸數學道館" />
    <meta
      name="twitter:description"
      content="選萌獸、答數學題、放招式，透過 ATG 即時對戰擊敗道館關主！"
    />
    <meta name="twitter:image" content="https://cagoooo.github.io/Poke/assets/og-math-beast-gym.png?v=20260702-1" />
    <link rel="stylesheet" href="styles.css?v=2026.07.02-3" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="遊戲狀態">
        <div>
          <p class="eyebrow">原創萌獸 Math Battle</p>
          <h1>萌獸數學道館</h1>
          <button id="classModeBtn" class="ghost-btn compact-btn" type="button">課堂模式</button>
        </div>
        <div class="audio-controls" aria-label="音訊控制">
          <button id="soundToggleBtn" class="ghost-btn compact-btn" type="button">音效：開</button>
          <button id="bgmToggleBtn" class="ghost-btn compact-btn" type="button">BGM：關</button>
          <label>
            <span>音量</span>
            <input id="volumeSlider" type="range" min="0" max="100" value="45" />
          </label>
        </div>
        <div class="scoreboard">
          <div>
            <span>連擊</span>
            <strong id="comboCount">0</strong>
          </div>
          <div>
            <span>答對</span>
            <strong id="correctCount">0</strong>
          </div>
          <div>
            <span>關卡</span>
            <strong id="stageCount">1</strong>
          </div>
          <div>
            <span>難度</span>
            <strong id="difficultyText">中</strong>
          </div>
        </div>
      </section>

      <section id="selectScreen" class="screen active" aria-labelledby="selectTitle">
        <div class="select-copy">
          <p class="eyebrow">選擇夥伴</p>
          <h2 id="selectTitle">挑一隻萌獸，準備用數學破關</h2>
          <p>每答對一題加減乘除，你的萌獸就會攻擊關主。答錯會被反擊，連擊越高傷害越漂亮。</p>
        </div>
        <div class="difficulty-panel" aria-label="難度選擇">
          <button class="difficulty-card" type="button" data-difficulty="low">
            <strong>低年級</strong>
            <span>10 到 30 以內，加減為主</span>
          </button>
          <button class="difficulty-card active" type="button" data-difficulty="mid">
            <strong>中年級</strong>
            <span>加減乘混合，偶爾整除</span>
          </button>
          <button class="difficulty-card" type="button" data-difficulty="high">
            <strong>高年級</strong>
            <span>較大數字，乘除更常出現</span>
          </button>
        </div>
        <div class="settings-panel" aria-label="題目設定">
          <div class="setting-group">
            <label for="operationSelect">題型</label>
            <select id="operationSelect">
              <option value="mixed">混合題</option>
              <option value="add">只練加法</option>
              <option value="subtract">只練減法</option>
              <option value="multiply">只練乘法</option>
              <option value="divide">只練除法</option>
            </select>
          </div>
          <div class="setting-group">
            <label for="maxNumberInput">最大數字</label>
            <input id="maxNumberInput" type="number" min="10" max="200" value="60" />
          </div>
          <label class="toggle-setting">
            <input id="allowCarryInput" type="checkbox" checked />
            <span>允許進位 / 退位</span>
          </label>
        </div>
        <div id="creatureGrid" class="creature-grid" aria-live="polite"></div>
      </section>

      <section id="battleScreen" class="screen battle-screen" aria-label="道館對戰">
        <div class="arena">
          <article class="fighter player-panel">
            <div class="fighter-meta">
              <span>你的夥伴</span>
              <strong id="playerName">-</strong>
            </div>
            <div class="hp-wrap">
              <div class="hp-label"><span>HP</span><span id="playerHpText">100 / 100</span></div>
              <div class="hp-track"><div id="playerHpBar" class="hp-bar player-hp"></div></div>
            </div>
            <div class="atg-wrap">
              <div class="hp-label"><span>ATG</span><span id="playerAtgText">等待中</span></div>
              <div class="atg-track"><div id="playerAtgBar" class="atg-bar player-atg"></div></div>
            </div>
            <div class="sprite-stage">
              <img id="playerSprite" class="sprite player-sprite" alt="" />
            </div>
          </article>

          <div class="battle-center">
            <div id="battleMessage" class="battle-message">讀取對戰資料中...</div>
            <button id="pauseBtn" class="ghost-btn hidden" type="button">暫停</button>
            <button id="nextStageBtn" class="primary-btn hidden" type="button">挑戰下一位關主</button>
            <button id="restartBtn" class="ghost-btn hidden" type="button">重新選擇萌獸</button>
          </div>

          <article class="fighter boss-panel">
            <div class="fighter-meta">
              <span>道館關主</span>
              <strong id="bossName">-</strong>
            </div>
            <div class="hp-wrap">
              <div class="hp-label"><span>HP</span><span id="bossHpText">120 / 120</span></div>
              <div class="hp-track"><div id="bossHpBar" class="hp-bar boss-hp"></div></div>
            </div>
            <div class="atg-wrap">
              <div class="hp-label"><span>ATG</span><span id="bossAtgText">蓄力中</span></div>
              <div class="atg-track"><div id="bossAtgBar" class="atg-bar boss-atg"></div></div>
            </div>
            <div class="sprite-stage">
              <img id="bossSprite" class="sprite boss-sprite" alt="" />
            </div>
          </article>
        </div>

        <form id="questionForm" class="question-panel hidden" autocomplete="off">
          <div>
            <p class="eyebrow" id="commandState">等待 ATG 蓄滿</p>
            <label id="questionText" for="answerInput">準備題目中...</label>
            <div id="defenseTimer" class="defense-timer hidden">
              <span>防禦倒數</span>
              <strong id="defenseTimerText">8.0</strong>
            </div>
          </div>
          <div class="answer-row">
            <input id="answerInput" type="number" inputmode="numeric" placeholder="答案" required />
            <button id="attackBtn" class="primary-btn" type="submit">攻擊</button>
          </div>
        </form>

        <section id="movePanel" class="move-panel hidden" aria-label="招式選擇">
          <button class="move-card active" type="button" data-move="quick">
            <strong>快速攻擊</strong>
            <span>穩定傷害，ATG 回復較快</span>
          </button>
          <button class="move-card" type="button" data-move="heavy">
            <strong>重擊</strong>
            <span>高傷害，但下次蓄力較慢</span>
          </button>
          <button class="move-card" type="button" data-move="heal">
            <strong>補血</strong>
            <span>答對恢復 HP</span>
          </button>
          <button class="move-card" type="button" data-move="charge">
            <strong>蓄力</strong>
            <span>下次攻擊變強</span>
          </button>
          <button class="move-card" type="button" data-move="guard">
            <strong>防禦姿態</strong>
            <span>答對後降低下一次傷害</span>
          </button>
        </section>

        <section id="reviewPanel" class="review-panel hidden" aria-labelledby="reviewTitle">
          <div id="summaryCards" class="summary-cards" aria-label="戰鬥結算"></div>
          <div>
            <p class="eyebrow">錯題回顧</p>
            <h2 id="reviewTitle">這次戰鬥的練習紀錄</h2>
          </div>
          <button id="retryMistakesBtn" class="primary-btn hidden" type="button">重練錯題</button>
          <div id="reviewList" class="review-list"></div>
        </section>
        <div id="effectsLayer" class="effects-layer" aria-hidden="true"></div>
        <div id="pauseOverlay" class="pause-overlay hidden" aria-hidden="true">已暫停</div>
      </section>
    </main>

    <script src="script.js?v=2026.07.02-3"></script>
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var APP_VERSION = "2026.07.02-3";
        var reloaded = false;

        function showUpdateNotice(waitingWorker) {
          if (document.getElementById("sw-update-toast")) return;

          var style = document.createElement("style");
          style.textContent =
            "#sw-update-toast{position:fixed;left:50%;bottom:18px;z-index:9999;width:min(430px,calc(100vw - 28px));transform:translateX(-50%);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 14px 14px 16px;background:#18212f;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:18px;box-shadow:0 22px 50px rgba(15,23,42,.34);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#sw-update-toast strong{display:block;font-size:15px;line-height:1.35}#sw-update-toast span{display:block;margin-top:2px;color:rgba(255,255,255,.72);font-size:12px;line-height:1.45}#sw-update-toast button{font:inherit;cursor:pointer}#sw-reload-btn{border:0;border-radius:12px;background:#fff;color:#2f6fed;padding:9px 14px;font-weight:900;white-space:nowrap}#sw-dismiss-btn{border:0;background:transparent;color:rgba(255,255,255,.74);font-size:20px;line-height:1;padding:5px 3px}";
          document.head.appendChild(style);

          var toast = document.createElement("div");
          toast.id = "sw-update-toast";
          toast.setAttribute("role", "alert");
          toast.innerHTML =
            '<div><strong>網站有新版本</strong><span>重新整理後會載入最新版，避免看到舊版畫面或舊資料。</span></div><div><button id="sw-reload-btn" type="button">重新整理載入</button><button id="sw-dismiss-btn" type="button" aria-label="稍後再說">×</button></div>';
          document.body.appendChild(toast);

          document.getElementById("sw-dismiss-btn").addEventListener("click", function () {
            toast.remove();
          });
          document.getElementById("sw-reload-btn").addEventListener("click", function () {
            toast.remove();
            if (waitingWorker) {
              waitingWorker.postMessage({ type: "SKIP_WAITING" });
            } else {
              window.location.reload();
            }
          });
        }

        navigator.serviceWorker
          .register("sw.js", { updateViaCache: "none" })
          .then(function (registration) {
            function watchWorker(worker) {
              worker.addEventListener("statechange", function () {
                if (worker.state === "installed" && navigator.serviceWorker.controller) {
                  showUpdateNotice(registration.waiting || worker);
                }
              });
            }

            if (registration.waiting && navigator.serviceWorker.controller) {
              showUpdateNotice(registration.waiting);
            }
            if (registration.installing) watchWorker(registration.installing);
            registration.addEventListener("updatefound", function () {
              if (registration.installing) watchWorker(registration.installing);
            });
            setInterval(function () {
              registration.update().catch(function () {});
            }, 60000);
          })
          .catch(function () {});

        navigator.serviceWorker.addEventListener("message", function (event) {
          if (event.data && event.data.type === "SW_ACTIVATED" && event.data.version !== APP_VERSION) {
            showUpdateNotice(null);
          }
        });

        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });

        function checkVersion() {
          fetch("version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              if (data && data.version && data.version !== APP_VERSION) showUpdateNotice(null);
            })
            .catch(function () {});
        }

        window.addEventListener("focus", checkVersion);
        window.addEventListener("online", checkVersion);
        window.addEventListener("pageshow", checkVersion);
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") checkVersion();
        });
        setTimeout(checkVersion, 8000);
        setInterval(checkVersion, 180000);
      })();
    </script>
  </body>
</html>
